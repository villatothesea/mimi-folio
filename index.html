<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 样式在 JS 之前进 head：避免等 Muya 包时 img 按 300×150 画出半截 logo -->
    <style>
      #app-icon { width: 18px; height: 18px; display: block; flex-shrink: 0; }
    </style>
    <link rel="stylesheet" href="/src/theme/tokens.css" />
    <link rel="stylesheet" href="/src/theme/tokens-dark.css" />
    <link rel="stylesheet" href="/src/theme/app.css" />
    <title>米素</title>
  </head>
  <body>
    <script>
      window.__bootErrs = [];
      window.addEventListener('error', (e) => window.__bootErrs.push(String(e.message) + '@' + (e.filename || '') + ':' + e.lineno));
      window.addEventListener('unhandledrejection', (e) => window.__bootErrs.push('rej:' + String(e.reason)));
    </script>
    <div id="app">
      <div id="main-row">
        <aside id="sidebar">
          <header id="sidebar-head">
            <img id="app-icon" src="/favicon.svg" alt="米素" width="18" height="18" />
            <span class="head-title">米素 Folio</span>
            <span class="head-actions">
              <button id="btn-settings" type="button" class="icon-btn" data-tip="设置"></button>
              <button id="btn-theme" type="button" class="icon-btn" data-tip="明暗切换"></button>
              <button id="btn-plus" type="button" class="icon-btn" data-tip="新建"></button>
            </span>
          </header>
          <nav id="files" aria-label="文件列表"></nav>
          <nav id="memo-rail" aria-label="速记筛选">
            <label class="memo-search">
              <span class="memo-search-ic"></span>
              <input id="memo-search" type="search" placeholder="搜索速记…" autocomplete="off" />
            </label>
            <div id="memo-cal"></div>
            <div id="memo-derived"></div>
            <div id="memo-tags"></div>
          </nav>
          <footer class="zone-bar" id="bar-left">
            <span id="app-brand" class="zone-text">
              <img class="folio-icon" src="/favicon.svg" alt="米素" width="18" height="18" />
              <span class="brand-name">米素 Folio</span>
            </span>
            <button id="collapse-left" type="button" class="icon-btn" data-tip="收起侧栏"></button>
            <span id="stat-count" class="zone-text"></span>
            <div id="filterbar" hidden aria-label="筛选">
              <button id="pill-all" type="button" data-view="all" data-tip="全部"></button>
              <button id="pill-notes" type="button" data-view="notes" data-tip="笔记"></button>
              <button id="pill-memos" type="button" data-view="memos" data-tip="速记"></button>
              <button id="pill-links" type="button" data-view="links" data-tip="外链"></button>
              <button id="pill-fav" type="button" data-view="fav" data-tip="星标"></button>
            </div>
            <div id="bar-left-actions">
              <button id="btn-filter-menu" type="button" class="icon-btn" data-tip="筛选" aria-haspopup="menu" aria-expanded="false"></button>
              <button id="btn-workspace" type="button" class="icon-btn" data-tip="工作区" aria-haspopup="dialog" aria-expanded="false"></button>
            </div>
          </footer>
        </aside>
        <main id="page">
          <header id="page-head">
            <div id="toolbar" aria-label="格式工具栏"></div>
            <button id="favorite-toggle" type="button" title="收藏（frontmatter favorite）">☆</button>
            <span id="save-state" role="status"></span>
          </header>
          <div id="toc-host">
            <button id="toc-fab" type="button" data-tip="目录" aria-label="目录" aria-expanded="false" aria-controls="toc"></button>
            <aside id="toc" hidden aria-label="文档目录">
              <nav id="toc-list"></nav>
            </aside>
          </div>
          <div id="expand-hints">
            <button id="expand-left" type="button" class="icon-btn breathe" data-tip="展开侧栏" hidden></button>
          </div>
          <section id="findbar-wrap">
            <span id="findbar" hidden>
              <input id="find-input" type="text" placeholder="文内查找…" />
              <span id="find-count"></span>
              <button id="find-prev" type="button" title="上一个（Shift+回车）">↑</button>
              <button id="find-next" type="button" title="下一个（回车）">↓</button>
              <input id="replace-input" type="text" placeholder="替换为…" />
              <button id="replace-one" type="button">替换</button>
              <button id="replace-all" type="button">全部</button>
              <button id="find-close" type="button" title="关闭（Esc）">×</button>
            </span>
          </section>
          <section id="memo-view" aria-label="速记流">
            <div id="memo-composer-card">
              <textarea id="memo-composer" placeholder="记下一条…" rows="3"></textarea>
              <div id="memo-composer-bar"></div>
            </div>
            <div id="memo-active"></div>
            <div id="memo-stream"></div>
          </section>
          <section id="html-preview" aria-label="网页预览">
            <iframe id="html-frame" sandbox="allow-scripts allow-same-origin" title="网页预览"></iframe>
          </section>
          <div id="doc-scroll">
            <div id="props-fold-slot" hidden>
              <button id="props-fold" type="button" class="icon-btn" aria-label="展开/收起YAML"></button>
            </div>
            <header id="doc-head" hidden>
              <section id="doc-title" aria-label="文件名"></section>
              <section id="props" aria-label="文档属性"></section>
            </header>
            <div id="editor-wrap"></div>
          </div>
          <footer class="zone-bar" id="bar-center">
            <nav id="breadcrumb" aria-label="路径">未打开</nav>
            <div id="doc-meta" class="zone-text"></div>
            <span id="stat-words" class="zone-text"></span>
          </footer>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
