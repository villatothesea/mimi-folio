<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>米素</title>
  </head>
  <body>
    <div id="app">
      <div id="main-row">
        <aside id="sidebar">
          <header id="sidebar-head">
            <img id="app-icon" src="/favicon.svg" alt="米素" />
            <span>米素</span>
          </header>
          <div id="filterbar" aria-label="筛选">
            <button id="pill-all" type="button" data-view="all" aria-pressed="true">全部</button>
            <button id="pill-notes" type="button" data-view="notes" aria-pressed="false">笔记</button>
            <button id="pill-memos" type="button" data-view="memos" aria-pressed="false">速记</button>
            <button id="pill-links" type="button" data-view="links" aria-pressed="false">外链</button>
          </div>
          <nav id="files" aria-label="文件列表"></nav>
          <footer id="sidebar-foot">
            <button id="add-note" type="button" class="icon-btn" data-tip="添加笔记"></button>
            <button id="add-memo" type="button" class="icon-btn" data-tip="添加速记"></button>
            <button id="add-folder" type="button" class="icon-btn" data-tip="添加文件夹"></button>
            <button id="link-outside" type="button" class="icon-btn" data-tip="链入外部 md"></button>
          </footer>
        </aside>
        <main id="page">
          <header id="page-head">
            <nav id="breadcrumb" aria-label="路径">未打开</nav>
            <button id="favorite-toggle" type="button" title="收藏（frontmatter favorite）">☆</button>
            <button id="find-toggle" type="button" title="查找替换（Ctrl+F）">查找</button>
            <span id="findbar" hidden>
              <input id="find-input" type="text" placeholder="查找…" />
              <span id="find-count"></span>
              <button id="find-prev" type="button" title="上一个（Shift+回车）">↑</button>
              <button id="find-next" type="button" title="下一个（回车）">↓</button>
              <input id="replace-input" type="text" placeholder="替换为…" />
              <button id="replace-one" type="button">替换</button>
              <button id="replace-all" type="button">全部</button>
              <button id="find-close" type="button" title="关闭（Esc）">×</button>
            </span>
            <span id="save-state" role="status"></span>
          </header>
          <section id="props" aria-label="文档属性" hidden></section>
          <div id="editor-wrap"></div>
        </main>
        <aside id="toc" aria-label="文档目录"></aside>
      </div>
      <footer id="statusbar">
        <span id="stat-count"></span>
        <span id="stat-words"></span>
        <span id="backlinks" aria-label="出链与反链"></span>
        <span id="stat-rest"></span>
        <button id="theme-toggle" type="button" title="明暗切换">主题</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
