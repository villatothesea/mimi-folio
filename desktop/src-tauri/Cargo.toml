[package]
name = "folio-desktop"
version = "0.0.0"
description = "米素 Folio 桌面壳"
authors = ["Villa"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-prevent-default = { version = "4", features = ["platform-windows"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
